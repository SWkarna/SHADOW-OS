<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../src/renderer/src/assets/main.css" />
</head>
<body style="margin:0;background:#020a0d;">
  <div style="height:100vh;width:100vw;">
    <main class="command-dashboard" style="height:100%;">
      <aside class="dashboard-left">
        <section class="command-panel media-panel">
          <div class="panel-title"><span>MEDIA LINK</span></div>
          <div class="media-frame"><div class="offline-feed"><span>SYSTEM OFFLINE</span></div></div>
        </section>
        <section class="command-panel headlines-panel">
          <div class="panel-title"><span>TODAY HEADLINES</span></div>
          <div class="headline-skeleton"><span/><span/><span/></div>
        </section>
      </aside>

      <section class="dashboard-center">
        <section class="command-panel orb-panel">
          <div class="orb-shell active"></div>
        </section>
      </section>

      <aside class="dashboard-right">
        <section class="command-panel intelligence-panel">
          <div class="panel-title"><span>VIRTUAL INTELLIGENCE HUB</span><span class="panel-actions"><em>15 SAVED</em></span></div>
          <div class="hub-history-list">
            <button class="hub-history-item"><span>Reply 1: The derivative of x^2 is 2x, computed via the power rule.</span></button>
            <button class="hub-history-item"><span>Reply 2: Python code to sort a list: sorted(items, key=len).</span></button>
            <button class="hub-history-item"><span>Reply 3: The capital of France is Paris; population ~2.1M.</span></button>
            <button class="hub-history-item"><span>Reply 4: Newton's second law: F = ma. Direction matters.</span></button>
            <button class="hub-history-item"><span>Reply 5: To compile: npm run build. Output goes to out/.</span></button>
            <button class="hub-history-item"><span>Reply 6: Quantum tunneling probability depends on barrier width.</span></button>
            <button class="hub-history-item"><span>Reply 7: Git rebase rewrites commit history; use with care.</span></button>
            <button class="hub-history-item"><span>Reply 8: The sum 1+2+...+n equals n(n+1)/2 for all positive n.</span></button>
            <button class="hub-history-item"><span>Reply 9: React keys must be stable and unique among siblings.</span></button>
            <button class="hub-history-item"><span>Reply 10: Electrolysis of water yields hydrogen and oxygen gas.</span></button>
            <button class="hub-history-item"><span>Reply 11: The light-year is a unit of distance, not time.</span></button>
            <button class="hub-history-item"><span>Reply 12: Use environment variables for secrets, never commit them.</span></button>
            <button class="hub-history-item"><span>Reply 13: Markov chains model state transitions with probabilities.</span></button>
            <button class="hub-history-item"><span>Reply 14: The Pythagorean theorem: a^2 + b^2 = c^2 in right triangles.</span></button>
            <button class="hub-history-item"><span>Reply 15: Memoization trades memory for computation speed.</span></button>
            <button class="hub-history-item"><span>Reply 16 (long): To deploy a production build you must first run the bundler with the production configuration so that assets are minified and hashed, then copy the entire output directory to your hosting provider and point the server at the index entry point, making sure cache headers and the SPA fallback rewrite are configured correctly.</span></button>
          </div>
        </section>
        <section class="command-panel agents-panel">
          <div class="panel-title"><span>SUB AGENTS</span></div>
          <button class="agent-row"><span class="agent-icon i0">◈</span><b>Main Assistant</b><small>● ONLINE</small></button>
          <button class="agent-row"><span class="agent-icon i1">◈</span><b>Data Analyst</b><small>● ONLINE</small></button>
        </section>
      </aside>

      <div class="dashboard-bottom">
        <section class="command-panel core-panel"><div class="panel-title"><span>CORE METRICS</span></div></section>
        <section class="command-panel status-panel"><div class="panel-title"><span>STATUS</span></div></section>
        <section class="command-panel modes-panel"><div class="panel-title"><span>MODES</span></div></section>
        <section class="command-panel shortcuts-panel"><div class="panel-title"><span>SHORTCUTS</span></div></section>
        <section class="command-panel connection-panel"><div class="panel-title"><span>CONNECTION</span></div></section>
      </div>
    </main>
  </div>
</body>
</html>
